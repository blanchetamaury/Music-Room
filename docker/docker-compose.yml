services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run --token eyJhIjoiNDlkN2Y1MTczM2MxMWIzYjAzYWJiNmM1MTQ4OTk3YTgiLCJ0IjoiMGExZDgwYzAtYmZhNi00ZTFhLWEwMDktODE0NjIwOGVmYmRiIiwicyI6Ik4yTmpOekpsTURNdFpqTTFOQzAwTldWa0xXRmtZVEF0TXpVek9UbGhNakV6TVRVeCJ9
    networks:
      - app
    restart: unless-stopped
    
  caddy:
    image: caddy:latest
    container_name: caddy
    expose:
      - "80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    container_name: backend
    working_dir: /app
    volumes:
      - ../backend:/app
      - /app/node_modules
    command: sh -c "npm i && npm run build && npm run dev"
    expose:
      - "3000"
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm i && npx expo start --host lan --non-interactive"
    expose:
      - "8081"
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  app:
    driver: bridge