openapi: 3.0.3
info:
    title: Music Room API
    version: 1.0.0
    description: |
        API for Music Room - a collaborative music application.

        All endpoints are mounted under `/api`, which is already part of the server URL
        below, so the paths in this document are relative to it.

        ## Authentication
        Two interchangeable mechanisms, both ending in the same `token` HttpOnly cookie:

        - **Email**: `POST /auth/signup`, `POST /auth/login`, `POST /auth/confirm`,
          `POST /auth/resend-verification`, `POST /auth/reset-password/request`,
          `POST /auth/reset-password/verify`.
        - **OAuth**: `POST /auth/oauth/start` returns a `code`, the mobile app opens the
          returned provider URL, then exchanges it with `POST /auth/session/exchange`.
          Providers are `oauth_fortytwo` and `oauth_google`.

        The session cookie is sent as `Authorization: Bearer <token>` by the mobile
        client, or as a plain cookie by the web client.

        ## CSRF protection
        Cookie-authenticated state-changing requests must send the `X-CSRF-Token`
        header, matching the `csrf` cookie. Requests authenticated with the
        `Authorization` header are exempt.

        ## Permissions
        Ownership and membership are enforced server side on every route:
        - playlists: `OWNER`, `EDITOR`, `VIEWER`; a pending invitation is read-only
        - events: `OWNER`, `ADMIN`, `MEMBER`; a pending invitation is read-only
        - devices: the owner, or a delegate granted `CONTROL` / `VIEW`

        ## Realtime
        Playlist and event mutations are published over Server-Sent Events, see
        `GET /events/{eventId}/stream` and `GET /playlists/{playlistId}/stream`.

        ## Rate limiting
        Login: 5 attempts per account and 20 per IP every 15 minutes, persisted in the
        database so it survives a restart. Mutations are rate limited per user.

        ## Pagination
        List routes accept `page` and `limit` and answer with a `pagination` object.

        ## Error format
        Every failure uses the same envelope and a meaningful status code:
        ```json
        { "success": false, "message": "Human readable message" }
        ```
        `400` invalid input, `401` missing or expired session, `403` not allowed,
        `404` not found (also used to hide private resources), `409` concurrent
        modification, `429` rate limited, `500` unexpected, `503` database
        temporarily unavailable (retry).

        ## Success format
        ```json
        { "success": true, "data": ... }
        ```
    contact:
        name: Music Room Team
    license:
        name: MIT
        url: https://opensource.org/license/mit

servers:
    - url: http://localhost:3000/api
      description: Local development server

tags:
    - name: Authentication
      description: Signup, login, email verification, password reset and OAuth sessions
    - name: Users
      description: Profile, preferences, field visibility, follows and likes
    - name: Deezer
      description: Track, album, artist and playlist metadata proxied from Deezer
    - name: Events
      description: Collaborative listening events, track suggestions and votes
    - name: Playlists
      description: Collaborative playlist editing with optimistic concurrency
    - name: Devices
      description: Device registration, playback control and delegation

components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: token
        csrfAuth:
            type: apiKey
            in: header
            name: X-CSRF-Token

    schemas:
        # Auth schemas
        RegisterRequest:
            type: object
            required: [mail, password, username]
            properties:
                mail:
                    type: string
                    format: email
                    example: 'user@example.com'
                password:
                    type: string
                    format: password
                    minLength: 8
                    pattern: '^(?=.*[a-zA-Z])(?=.*[0-9])(?=.*[^a-zA-Z0-9]).+$'
                    description: >
                        At least 8 characters, with a letter, a digit and a special
                        character.
                    example: 'SecurePass123!'
                username:
                    type: string
                    minLength: 3
                    maxLength: 10
                    example: 'musiclover'

        LoginRequest:
            type: object
            required:
                - mail
                - password
            properties:
                mail:
                    type: string
                    format: email
                    example: 'user@example.com'
                password:
                    type: string
                    format: password
                    example: 'SecurePass123!'

        AuthResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
            description: >
                The session itself is delivered in the `token` HttpOnly cookie, so there is
                nothing sensitive in the body. Mobile clients read the cookie and replay it
                as `Authorization: Bearer <token>`.

        DeviceListResponse:
            type: object
            description: A non-paginated list of devices; the array sits directly under `data`.
            required: [success, data]
            properties:
                success:
                    type: boolean
                    example: true
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Device'

        ErrorResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: 'Invalid password or mail'
            required: [success, message]

        PaginatedResponse:
            type: object
            description: >
                The inner payload of a paginated list. It is nested under `data` by the
                response envelope, so a list endpoint returns
                `{ "success": true, "data": { "data": [...], "page": 1, ... } }`.
            required: [data, page, page_size, total_pages]
            properties:
                data:
                    type: array
                    items: {}
                page:
                    type: integer
                    minimum: 1
                page_size:
                    type: integer
                    minimum: 1
                total_pages:
                    type: integer
                    minimum: 0

        ListEnvelope:
            type: object
            required: [success, data]
            properties:
                success:
                    type: boolean
                    example: true
                data:
                    $ref: '#/components/schemas/PaginatedResponse'

        UserProfile:
            type: object
            properties:
                id:
                    type: string
                email:
                    type: string
                    format: email
                username:
                    type: string
                avatarUrl:
                    type: string
                    format: uri
                    nullable: true
                emailVerified:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time

        DeezerArtist:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                picture_medium:
                    type: string
                    format: uri
                    nullable: true

        DeezerAlbum:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                cover_medium:
                    type: string
                    format: uri
                    nullable: true
                cover_big:
                    type: string
                    format: uri
                    nullable: true

        DeezerTrack:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                title_short:
                    type: string
                    nullable: true
                duration:
                    type: integer
                explicit_lyrics:
                    type: boolean
                preview:
                    type: string
                    format: uri
                    nullable: true
                artist:
                    $ref: '#/components/schemas/DeezerArtist'
                album:
                    $ref: '#/components/schemas/DeezerAlbum'

        DeezerTrackListResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/DeezerTrack'

        DeezerTrackResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/DeezerTrack'

        # Event schemas (Music Track Vote)
        Event:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                    nullable: true
                visibility:
                    type: string
                    enum: [PUBLIC, PRIVATE]
                votingPolicy:
                    type: string
                    enum: [EVERYONE, INVITED_ONLY, LOCATION_TIME]
                latitude:
                    type: number
                    nullable: true
                longitude:
                    type: number
                    nullable: true
                radius:
                    type: integer
                    nullable: true
                startAt:
                    type: string
                    format: date-time
                    nullable: true
                endAt:
                    type: string
                    format: date-time
                    nullable: true
                ownerId:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                myRole:
                    type: string
                    enum: [OWNER, ADMIN, MEMBER]
                    nullable: true
                    description: Null while the caller only holds a pending invitation.
                myInvitationStatus:
                    type: string
                    enum: [PENDING, ACCEPTED, DECLINED]
                    nullable: true
                canEdit:
                    type: boolean
                owner:
                    $ref: '#/components/schemas/UserProfile'
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventMember'
                tracks:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventTrack'

        EventMember:
            type: object
            properties:
                id:
                    type: string
                role:
                    type: string
                    enum: [ADMIN, MEMBER]
                status:
                    type: string
                    enum: [PENDING, ACCEPTED, DECLINED]
                    description: A pending member can read the event but not take part in it.
                user:
                    $ref: '#/components/schemas/UserProfile'

        EventCreateRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                description:
                    type: string
                    maxLength: 500
                visibility:
                    type: string
                    enum: [PUBLIC, PRIVATE]
                    default: PUBLIC
                votingPolicy:
                    type: string
                    enum: [EVERYONE, INVITED_ONLY, LOCATION_TIME]
                    default: EVERYONE
                latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                radius:
                    type: integer
                    minimum: 1
                    maximum: 100000
                startAt:
                    type: string
                    format: date-time
                endAt:
                    type: string
                    format: date-time
            description: >
                Coordinates and the time window are only meaningful for the
                LOCATION_TIME voting policy.

        VoteRequest:
            type: object
            required: [eventId, trackId]
            properties:
                eventId:
                    type: string
                trackId:
                    type: string
            description: >
                Vote for a suggested track. Voting twice for the same track keeps a single
                vote; DELETE with the same body withdraws it.

        Playlist:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                ownerId:
                    type: string
                cover:
                    type: string
                    format: uri
                    nullable: true
                description:
                    type: string
                    nullable: true
                visibility:
                    type: string
                    enum: [PUBLIC, PRIVATE]
                editPolicy:
                    type: string
                    enum: [EVERYONE, INVITED_ONLY]
                version:
                    type: integer
                    description: Incremented on every edit; send it back as `expectedVersion`.
                lastEditedBy:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                owner:
                    $ref: '#/components/schemas/UserProfile'
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlaylistMember'
                tracks:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlaylistTrack'

        PlaylistMember:
            type: object
            properties:
                id:
                    type: string
                playlistId:
                    type: string
                userId:
                    type: string
                role:
                    type: string
                    enum: [OWNER, EDITOR, VIEWER]
                invitedAt:
                    type: string
                    format: date-time
                acceptedAt:
                    type: string
                    format: date-time
                    nullable: true
                user:
                    $ref: '#/components/schemas/UserProfile'

        PlaylistCreateRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                cover:
                    type: string
                    format: uri
                    nullable: true
                description:
                    type: string
                    maxLength: 500
                visibility:
                    type: string
                    enum: [PUBLIC, PRIVATE]
                    default: PUBLIC
                editPolicy:
                    type: string
                    enum: [EVERYONE, INVITED_ONLY]
                    default: EVERYONE
            description: >
                `editPolicy` decides who may add tracks once the playlist is public:
                EVERYONE, or INVITED_ONLY to restrict edits to accepted members.

        PlaylistTrack:
            type: object
            properties:
                id:
                    type: string
                playlistId:
                    type: string
                trackId:
                    type: string
                    description: Deezer track id.
                position:
                    type: integer
                addedBy:
                    type: string
                addedAt:
                    type: string
                    format: date-time
                track:
                    allOf:
                        - $ref: '#/components/schemas/DeezerTrack'
                    description: Present on the single playlist route, omitted from the list route.

        PlaylistTrackAddRequest:
            type: object
            required: [playlistId, trackId]
            properties:
                playlistId:
                    type: string
                trackId:
                    type: string
                    description: Deezer track id.
                position:
                    type: integer
                    description: Insertion index; appended when omitted.

        PlaylistTrackMoveRequest:
            type: object
            required: [playlistId, trackId, newPosition]
            properties:
                playlistId:
                    type: string
                trackId:
                    type: string
                newPosition:
                    type: integer
                expectedVersion:
                    type: integer
                    description: Optimistic concurrency guard; omit to overwrite.

        Device:
            type: object
            properties:
                id:
                    type: string
                deviceName:
                    type: string
                platform:
                    type: string
                    enum: [ios, android, web]
                appVersion:
                    type: string
                lastSeenAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time
                    nullable: true
                permissions:
                    type: array
                    items:
                        $ref: '#/components/schemas/DevicePermission'

        DevicePermission:
            type: object
            properties:
                id:
                    type: string
                delegateUserId:
                    type: string
                permission:
                    type: string
                    enum: [CONTROL, VIEW]
                expiresAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time

        EventTrack:
            type: object
            properties:
                trackId:
                    type: string
                status:
                    type: string
                    enum: [PENDING, APPROVED, REJECTED, PLAYING, PLAYED]
                voteCount:
                    type: integer
                suggestedBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                votedByMe:
                    type: boolean

        DeviceState:
            type: object
            properties:
                deviceId:
                    type: string
                level:
                    type: string
                    enum: [OWNER, DELEGATE]
                    description: How the caller reaches this device.
                state:
                    type: object
                    properties:
                        deviceId:
                            type: string
                        status:
                            type: string
                            enum: [IDLE, PLAYING, PAUSED]
                        queue:
                            type: array
                            items:
                                type: string
                        history:
                            type: array
                            items:
                                type: string
                        currentTrackId:
                            type: string
                            nullable: true
                        positionMs:
                            type: integer
                        volume:
                            type: integer
                            minimum: 0
                            maximum: 100
                        updatedBy:
                            type: string
                            nullable: true
                        updatedAt:
                            type: string
                            format: date-time

        DeviceControlRevokeRequest:
            type: object
            required: [deviceId]
            properties:
                deviceId:
                    type: string
            description: Revoke a device you own, ending every delegation it carries.

        UpdatePlaylistRequest:
            type: object
            properties:
                playlistId:
                    type: string
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                cover:
                    type: string
                    format: uri
                    nullable: true
                description:
                    type: string
                    maxLength: 500
                visibility:
                    type: string
                    enum: [PUBLIC, PRIVATE]
                editPolicy:
                    type: string
                    enum: [EVERYONE, INVITED_ONLY]
                expectedVersion:
                    type: integer
                    description: Optimistic concurrency guard. Send the version you read.
            description: Every field is optional; send `expectedVersion` to detect a concurrent edit.

        UpdateEventRequest:
            type: object
            required: [eventId]
            properties:
                eventId:
                    type: string
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                description:
                    type: string
                    maxLength: 500
                    nullable: true
                visibility:
                    type: string
                    enum: [PUBLIC, PRIVATE]
                votingPolicy:
                    type: string
                    enum: [EVERYONE, INVITED_ONLY, LOCATION_TIME]
                latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                    nullable: true
                longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                    nullable: true
                radius:
                    type: integer
                    minimum: 1
                    maximum: 100000
                    nullable: true
                startAt:
                    type: string
                    format: date-time
                    nullable: true
                endAt:
                    type: string
                    format: date-time
                    nullable: true

        EventTrackRequest:
            type: object
            required: [eventId, trackId]
            properties:
                eventId:
                    type: string
                trackId:
                    type: string
                latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                longitude:
                    type: number
                    minimum: -180
                    maximum: 180
            description: >
                Suggest a track on an event. `latitude` and `longitude` must be sent
                together and are required when the event voting policy is
                LOCATION_TIME.

        DeviceDelegationRequest:
            type: object
            required: [deviceId, delegateUserId]
            properties:
                deviceId:
                    type: string
                delegateUserId:
                    type: string
                permission:
                    type: string
                    enum: [CONTROL, VIEW]
                    default: CONTROL
                expiresAt:
                    type: string
                    format: date-time
                    description: Optional expiry; omit for a permanent delegation.

        # --- Session / OAuth -------------------------------------------------
        SessionExchangeRequest:
            type: object
            required: [code]
            properties:
                code:
                    type: string
                    minLength: 32
                    description: Opaque code returned by POST /auth/oauth/start.
            additionalProperties: false

        OAuthStartRequest:
            type: object
            required: [provider]
            properties:
                provider:
                    type: string
                    enum: [oauth_fortytwo, oauth_google]
                redirectUri:
                    type: string
                    format: uri
                    description: Where the provider should send the user back.
                    nullable: true

        OAuthStartResponse:
            type: object
            properties:
                success:
                    type: boolean
                data:
                    type: object
                    properties:
                        code:
                            type: string
                        url:
                            type: string
                            format: uri

        ConfirmTokenRequest:
            type: object
            required: [token]
            properties:
                token:
                    type: string
                    minLength: 32

        ResendVerificationRequest:
            type: object
            required: [mail]
            properties:
                mail:
                    type: string
                    format: email

        ResetPasswordRequest:
            type: object
            required: [mail]
            properties:
                mail:
                    type: string
                    format: email

        ResetPasswordVerifyRequest:
            type: object
            required: [mail, code, password]
            properties:
                mail:
                    type: string
                    format: email
                code:
                    type: string
                    minLength: 6
                    maxLength: 6
                password:
                    type: string
                    minLength: 6

        # --- Users -----------------------------------------------------------
        UpdateUserRequest:
            type: object
            properties:
                username:
                    type: string
                    minLength: 2
                    maxLength: 40
                avatarUrl:
                    type: string
                    format: uri
                    nullable: true
            description: Both fields are optional; an empty avatarUrl clears the avatar.

        FollowRequest:
            type: object
            required: [user_id]
            properties:
                user_id:
                    type: string
            additionalProperties: false

        FollowState:
            type: object
            properties:
                following:
                    type: boolean
                followersCount:
                    type: integer
                followingCount:
                    type: integer

        LikeManageRequest:
            type: object
            required: [track_id]
            properties:
                track_id:
                    type: string
            description: Likes a track when it is not liked yet, unlikes it otherwise.

        VisibilityUpdateRequest:
            type: object
            description: >
                At least one field is required. `FRIENDS` requires an accepted friend
                relationship; `HIDDEN` removes the field from the public profile.
            properties:
                PROFILE_BASICS:
                    $ref: '#/components/schemas/VisibilityLevel'
                MUSIC_PREFERENCES:
                    $ref: '#/components/schemas/VisibilityLevel'
                LIKES:
                    $ref: '#/components/schemas/VisibilityLevel'
                PLAYLISTS:
                    $ref: '#/components/schemas/VisibilityLevel'
                PLAY_HISTORY:
                    $ref: '#/components/schemas/VisibilityLevel'
            additionalProperties: false

        VisibilityLevel:
            type: string
            enum: [PUBLIC, FRIENDS, PRIVATE]

        MusicPreferencesUpdateRequest:
            type: object
            properties:
                favoriteGenres:
                    $ref: '#/components/schemas/PreferenceIdList'
                favoriteArtists:
                    $ref: '#/components/schemas/PreferenceIdList'
                favoriteAlbums:
                    $ref: '#/components/schemas/PreferenceIdList'
                favoriteTracks:
                    $ref: '#/components/schemas/PreferenceIdList'
            additionalProperties: false

        PreferenceIdList:
            type: array
            maxItems: 100
            items:
                type: string

        # --- Playlists -------------------------------------------------------
        PlaylistMemberRequest:
            type: object
            required: [playlistId, userId]
            properties:
                playlistId:
                    type: string
                userId:
                    type: string
                role:
                    type: string
                    enum: [OWNER, EDITOR, VIEWER]
                    default: EDITOR

        PlaylistInviteRequest:
            type: object
            required: [playlistId, username]
            properties:
                playlistId:
                    type: string
                username:
                    type: string
                    minLength: 3
                    maxLength: 10
                role:
                    type: string
                    enum: [EDITOR, VIEWER]
                    default: EDITOR

        PlaylistAcceptRequest:
            type: object
            required: [playlistId]
            properties:
                playlistId:
                    type: string
                userId:
                    type: string
                    description: Optional, defaults to the caller. Needed to accept for somebody else.

        PlaylistRemoveMusicRequest:
            type: object
            required: [playlistId, trackId]
            properties:
                playlistId:
                    type: string
                trackId:
                    type: string

        # --- Events ----------------------------------------------------------
        EventMemberInviteRequest:
            type: object
            required: [eventId]
            properties:
                eventId:
                    type: string
                username:
                    type: string
                    minLength: 3
                    maxLength: 30
                userId:
                    type: string
                role:
                    type: string
                    enum: [ADMIN, MEMBER]
                    default: MEMBER
            description: Provide either username or userId to identify the invitee.

        EventMemberRefRequest:
            type: object
            required: [eventId]
            properties:
                eventId:
                    type: string
                userId:
                    type: string
                    description: Optional so a member can leave or decline without an id.

        EventMemberRoleRequest:
            type: object
            required: [eventId]
            properties:
                eventId:
                    type: string
                userId:
                    type: string
                role:
                    type: string
                    enum: [ADMIN, MEMBER]

        EventStatusRequest:
            type: object
            required: [eventId, status]
            properties:
                eventId:
                    type: string
                status:
                    type: string
                    enum: [IDLE, PLAYING, PAUSED, ENDED]

        # --- Devices ---------------------------------------------------------
        RegisterDeviceRequest:
            type: object
            required: [deviceName, platform, appVersion]
            properties:
                deviceName:
                    type: string
                    minLength: 1
                    maxLength: 100
                platform:
                    type: string
                    enum: [ios, android, web]
                appVersion:
                    type: string
                    minLength: 1
                    maxLength: 30

        DeviceControlRequest:
            type: object
            required: [deviceId, command]
            properties:
                deviceId:
                    type: string
                command:
                    type: string
                    enum: [play, pause, next, previous, setQueue, skipTo, setVolume]
                tracks:
                    type: array
                    maxItems: 200
                    items:
                        type: string
                    description: Required by setQueue.
                trackId:
                    type: string
                    description: Required by skipTo.
                volume:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Required by setVolume.

        # --- Generic ---------------------------------------------------------
        DeezerAlbumListResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/DeezerAlbum'
                total:
                    type: integer

        OkResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true

paths:
  /auth/signup:
    post:
      tags:
      - Authentication
      summary: Create an account
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '201':
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid input
          content:
            application/json:
